name: Diagnóstico suite completa (corpus normativo externo pendiente)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnostico-suite.yml"
  workflow_dispatch:

jobs:
  full-unittest-ubuntu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONIOENCODING: utf-8
      OECE_DATA_DIR: ./data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias Python
        run: python -m pip install -r requirements-linux.txt
      - name: Preparar carpetas privadas de pruebas
        run: python -c "from pathlib import Path; [Path(p).mkdir(parents=True,exist_ok=True) for p in ('data','normativa/indices/pruebas','normativa/ocr/pruebas')]"
      - name: Suite completa estricta (resultado rojo si faltan fuentes o hay defectos)
        run: python -m unittest discover -s tests -p "test_*.py" -v
