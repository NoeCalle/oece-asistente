name: OECE — suite completa con corpus normativo (manual)

# Este workflow no aparece como "verde" en un push sin ejecutar la suite.
# Lanzarlo manualmente solo cuando los originales normativos sean recuperables.
on:
  workflow_dispatch:

jobs:
  unittest:
    name: Suite completa con originales — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONIOENCODING: utf-8
      OECE_DATA_DIR: ./data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-linux.txt
      - name: Instalar Tesseract spa y Poppler en Ubuntu
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-spa poppler-utils
      - name: Instalar dependencias Python
        run: python -m pip install -r requirements-linux.txt
      - name: Preparar carpetas excluidas de Git
        run: python -c "from pathlib import Path; [Path(p).mkdir(parents=True,exist_ok=True) for p in ('data','normativa/indices/pruebas','normativa/ocr/pruebas')]"
      - name: Validar sintaxis y codificación
        run: python -m compileall -q oece scripts tests
      - name: Recuperar fuentes normativas y verificar hashes (obligatorio)
        run: python scripts/preparar_biblioteca_ci.py
      - name: Suite unittest completa (obligatoria, sin skip)
        run: python -m unittest discover -s tests -p "test_*.py" -v
