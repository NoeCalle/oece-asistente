name: Pruebas portabilidad OECE

on:
  push:
    branches: [main]
    paths:
      - "oece/**"
      - "scripts/**"
      - "tests/**"
      - "requirements-indexacion.txt"
      - ".github/workflows/tests.yml"
  pull_request:
    paths:
      - "oece/**"
      - "scripts/**"
      - "tests/**"
      - "requirements-indexacion.txt"
      - ".github/workflows/tests.yml"
  workflow_dispatch:

jobs:
  portabilidad-y-regresion:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependencias
        run: python -m pip install -r requirements-indexacion.txt
      - name: Preparar directorios de pruebas ignorados por Git
        run: mkdir -p data normativa/indices/pruebas
      - name: Compilar módulos Python
        run: python -m compileall -q oece scripts tests
      - name: Probar ruta configurable y permisos Git
        run: python -m unittest discover -s tests -p "test_data_dir.py" -v
      - name: Regresión de respaldos
        run: python -m unittest discover -s tests -p "test_respaldo.py" -v
      - name: Regresión de expedientes sintéticos
        run: python -m unittest discover -s tests -p "test_expediente.py" -v

# El resto de la suite depende de originales normativos que no están en Git.
# No se descargan ni publican originales privados en runners compartidos.
