name: OECE — regresión multiplataforma sin originales privados

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: smoke-oece-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portabilidad:
    name: Linux y Windows — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONIOENCODING: utf-8
      OECE_DATA_DIR: ./data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tesseract spa y Poppler nativos en Ubuntu
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-spa poppler-utils
      - name: Dependencias Python
        run: python -m pip install -r requirements-linux.txt
      - name: Preparar carpetas privadas de prueba
        run: python -c "from pathlib import Path; [Path(p).mkdir(parents=True,exist_ok=True) for p in ('data','normativa/indices/pruebas','normativa/ocr/pruebas')]"
      - name: Compilar todos los módulos
        run: python -m compileall -q oece scripts tests
      - name: Configuración de rutas
        run: python -m unittest discover -s tests -p "test_data_dir.py" -v
      - name: OCR y panel Linux/Windows
        run: python -m unittest discover -s tests -p "test_linux_compat.py" -v
      - name: Rutas POSIX e índices heredados
        run: python -m unittest discover -s tests -p "test_rutas_posix.py" -v
      - name: Respaldos
        run: python -m unittest discover -s tests -p "test_respaldo.py" -v
      - name: Expedientes sintéticos
        run: python -m unittest discover -s tests -p "test_expediente.py" -v
